name: Debug Asio

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Asio
        run: |
          sudo apt-get update
          sudo apt-get install -y libasio-dev libsqlite3-dev

      - name: make
        run: make


      - name: Upload server binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload api-binary ./build/server --clobber

